<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Convite | 15 Anos da Manu</title>

<style>
  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    background:#000;
    width:100%;
    overflow-x:hidden;
  }

  /* ---------- INTRO EM VÍDEO ---------- */
  #intro{
    position:fixed;
    inset:0;
    background:#000;
    z-index:100;
    transition:opacity 1.1s ease;
  }
  #intro.oculto{
    opacity:0;
    pointer-events:none;
  }
  #video-convite{
    width:100%;
    height:100dvh;
    object-fit:cover;
    display:block;
  }
  #pular-video{
    position:absolute;
    bottom:max(20px, env(safe-area-inset-bottom));
    right:20px;
    color:rgba(255,255,255,.75);
    font-family:Georgia, serif;
    font-style:italic;
    font-size:.95rem;
    background:rgba(0,0,0,.3);
    border:1px solid rgba(255,255,255,.4);
    border-radius:30px;
    padding:8px 16px;
    cursor:pointer;
  }
  /* ---------- TELA DE TOQUE INICIAL ---------- */
  #toque-inicial{
    position:fixed;
    inset:0;
    background:#000;
    z-index:200;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:opacity .6s ease;
  }
  #toque-inicial.oculto{
    opacity:0;
    pointer-events:none;
  }
  #toque-inicial{
    flex-direction:column;
    gap:16px;
  }
  #toque-inicial img{
    max-width:60vw;
    height:auto;
  }
  #toque-inicial p{
    color:#fff;
    font-family:Georgia, serif;
    font-style:italic;
    font-size:1.27rem;
    letter-spacing:.03em;
    text-align:center;
    padding:0 30px;
    animation:pulsar 2s ease-in-out infinite;
  }
  @keyframes pulsar{
    0%,100%{ opacity:.55; }
    50%{ opacity:1; }
  }
  @media (prefers-reduced-motion: reduce){
    #toque-inicial p{ animation:none; }
  }

  /* ---------- IMAGEM FINAL ---------- */
  #convite{
    position:relative;
    opacity:0;
    transition:opacity 1.2s ease;
  }
  #convite.visivel{ opacity:1; }

  #convite img{
    display:block;
    width:100%;
    height:auto;
  }

  /* Áreas clicáveis sobre a imagem (localização e confirmação) */
  #convite a.area-clicavel{
    position:absolute;
    display:block;
  }
  #area-localizacao{
    top:46.6%;
    height:9%;
  }
  #area-confirmacao{
    top:58.3%;
    height:8.8%;
  }
  #convite a.area-clicavel{
    left:4.4%;
    width:91.2%;
  }
</style>
</head>
<body>

  <!-- ===== TOQUE INICIAL (necessário para liberar som no celular) ===== -->
  <div id="toque-inicial">
    <img src="imgCliqueAqui.jpg" alt="">
    <p>toque para abrir<br>o convite</p>
  </div>

  <!-- ===== INTRO: VÍDEO EM TELA CHEIA, COM SOM ===== -->
  <div id="intro">
    <video id="video-convite" playsinline preload="auto">
      <source src="video.mp4" type="video/mp4">
    </video>
    <button id="pular-video">pular vídeo ›</button>
  </div>

  <!-- ===== MÚSICA DE FUNDO, EM LOOP ===== -->
  <audio id="musica-fundo" src="musica_final.mp3" loop preload="auto"></audio>

  <!-- ===== IMAGEM DO CONVITE ===== -->
  <main id="convite">
    <img src="arteSite.jpg" alt="Convite 15 anos">
    <a class="area-clicavel" id="area-localizacao"
       href="https://maps.app.goo.gl/rCinyTKf5V7VvfXc7"
       target="_blank" rel="noopener"
       aria-label="Ver localização no mapa"></a>
    <a class="area-clicavel" id="area-confirmacao"
       href="https://wa.me/5548984410170?text=Confirma%C3%A7%C3%A3o%20de%20presen%C3%A7a%20no%20anivers%C3%A1rio%20de%2015%20anos%20da%20Emanuelli.%20Convidados%3A%20%5BInforme%20os%20nomes%20aqui%5D"
       target="_blank" rel="noopener"
       aria-label="Confirmar presença pelo WhatsApp"></a>
  </main>

<script>
  const toque    = document.getElementById('toque-inicial');
  const intro    = document.getElementById('intro');
  const video    = document.getElementById('video-convite');
  const musica   = document.getElementById('musica-fundo');
  const convite  = document.getElementById('convite');
  const btnPular = document.getElementById('pular-video');

  function mostrarConvite(){
    intro.classList.add('oculto');
    convite.classList.add('visivel');
    setTimeout(() => intro.remove(), 1200);
  }

  // O toque é um gesto direto do usuário: a partir dele, todo
  // navegador (incluindo Chrome no Android) libera áudio com som.
  toque.addEventListener('click', () => {
    toque.classList.add('oculto');
    setTimeout(() => toque.remove(), 700);
    video.play();
    musica.play();
  }, { once:true });

  video.addEventListener('ended', mostrarConvite);
  btnPular.addEventListener('click', mostrarConvite);
  video.addEventListener('error', mostrarConvite);
</script>

</body>
</html>
